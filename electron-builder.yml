appId: app.agentboard
productName: agentboard
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# node-pty's native module and spawn-helper must live outside the asar (SPEC §15.3);
# node-pty rewrites app.asar -> app.asar.unpacked for spawn-helper itself.
asarUnpack:
  - "**/node_modules/node-pty/**"
extraResources:
  - from: resources
    to: resources
    filter: ["**/*"]
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: false
    NSUserNotificationAlertStyle: banner
npmRebuild: false
